    <style>
        :root { 
            --white: #ffffff; 
            --dark: #000000; 
            --light-bg: #f0f2f5; 
            --card: rgba(255, 255, 255, 0.95); 
            --text-dark: #1c1c1e;
            --text-light: #f1f1f4;
            --wp: #25d366; 
            --gray: #8e8e93;
            --border: rgba(0, 0, 0, 0.08);
            --blur: blur(25px);
            --neon-blue: #00f2ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--light-bg); color: var(--text-dark); overflow: hidden; height: 100vh; position: relative; }

        #authGateway {

            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .gateway-card {
            background: var(--white); width: 100%; max-width: 420px; padding: 40px 30px; 
            border-radius: 32px; box-shadow: 0 30px 70px rgba(0,0,0,0.1); border: 1px solid var(--border);
            text-align: center;
        }
        .gateway-logo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .gateway-logo .logo-box { background: var(--dark); color: var(--white); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .gateway-logo .logo-text { font-family: 'Orbitron'; font-weight: 900; font-size: 26px; color: var(--dark); letter-spacing: 1px; }
        .gateway-form { display: block; }

        .app-layout { display: flex; width: 100%; height: 100vh; max-width: 1400px; margin: 0 auto; position: relative; }

        .sidebar {
            width: 280px; height: 100vh; background: var(--white); border-right: 1px solid var(--border);
            padding: 30px 20px; display: flex; flex-direction: column; justify-content: space-between; z-index: 100;
        }
        .side-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 40px; padding-left: 10px; }
        .side-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .menu-item { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 16px; color: var(--text-dark); font-size: 14px; font-weight: 600; text-decoration: none; background: none; border: none; width: 100%; text-align: left; cursor: pointer; transition: 0.2s; }
        .menu-item i { font-size: 20px; width: 24px; text-align: center; color: var(--dark); }
        .menu-item:hover, .menu-item.active { background: var(--light-bg); }

        .app-header { 
            position: fixed; top: 0; left: 0; width: 100%; height: 65px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: var(--blur);
            display: none; justify-content: space-between; align-items: center;
            padding: 0 24px; z-index: 900; border-bottom: 1px solid var(--border);
        }

        .main-content { flex: 1; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; }
        .reels-container { 
            width: 100%; height: calc(100vh - 40px); max-width: 450px;
            overflow-y: scroll; scroll-snap-type: y mandatory; 
            scrollbar-width: none; border-radius: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }
        .reels-container::-webkit-scrollbar { display: none; }

        .reel-item { 
            width: 100%; height: calc(100vh - 40px); 
            scroll-snap-align: start; 
            position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .video-player { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        .interaction-panel { 
            position: absolute; right: 16px; bottom: 30px; 
            display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10;
        }
        .action-node { display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: none; color: var(--white); cursor: pointer; }
        .action-node i { width: 48px; height: 48px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; backdrop-filter: blur(15px); transition: 0.2s; color: var(--white); }
        .action-node:hover i { transform: scale(1.08); }
        .action-node.liked i { color: #ff4757; background: rgba(255, 255, 255, 0.9); }
        .action-node span { font-size: 11px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.4); }

        .reel-details { 
            position: absolute; left: 20px; bottom: 25px; right: 85px; 
            z-index: 10; display: flex; flex-direction: column; gap: 10px;
        }
        .author-info { display: flex; align-items: center; gap: 10px; }
        .author-avatar { width: 36px; height: 36px; background: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: var(--dark); border: 1px solid rgba(255,255,255,0.3); }
        .author-info h4 { font-size: 14px; font-weight: 700; color: var(--white); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .btn-follow { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); color: var(--white); padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; backdrop-filter: blur(5px); transition: 0.2s; }
        .btn-follow.following { background: var(--white); color: var(--dark); }
        .reel-caption { font-size: 12px; color: #f1f1f1; line-height: 1.4; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .double-tap-heart { position: absolute; font-size: 80px; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(0); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s; z-index: 5; color: #ff4757; text-shadow: 0 0 25px rgba(255,71,87,0.5); }

        .app-modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); 
            backdrop-filter: blur(20px); z-index: 3000; 
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-body { 
            background: var(--white); border: 1px solid rgba(0,0,0,0.05); 
            width: 100%; max-width: 460px; padding: 30px; border-radius: 28px; 
            position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.1);
        }
        .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--gray); font-size: 24px; cursor: pointer; z-index: 10; }
        .modal-title { font-family: 'Orbitron'; font-weight: 900; font-size: 18px; margin-bottom: 20px; text-align: center; color: var(--dark); }
        
        .form-group { margin-bottom: 16px; position: relative; }
        .form-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gray); }
        .form-input { width: 100%; background: var(--light-bg); border: 1px solid transparent; padding: 14px 14px 14px 46px; border-radius: 14px; color: var(--dark); outline: none; font-size: 13px; font-weight: 500; transition: 0.3s; }
        .form-input:focus { border-color: var(--dark); background: var(--white); }
        .submit-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--dark); color: var(--white); font-family: 'Orbitron'; font-weight: 900; font-size: 13px; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { opacity: 0.9; }

        .app-bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: var(--blur);
            border-top: 1px solid var(--border);
            display: none; justify-content: space-around; align-items: center; z-index: 1000;
        }

        .share-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        .share-option { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 14px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--light-bg); text-decoration: none; color: var(--dark); transition: 0.2s; }
        .share-option:hover { background: #e8e8ed; transform: translateY(-2px); }
        .share-option i { font-size: 22px; }

        .esentech-footer-tag { position: absolute; bottom: 25px; left: 0; width: 100%; text-align: center; font-size: 9px; font-family: 'Orbitron'; font-weight:900; color: rgba(0,0,0,0.15); letter-spacing: 2px; pointer-events: none; }

        @media (max-width: 768px) {
            body { background: #000; }
            .sidebar { display: none; }
            .app-header { display: flex; }
            .app-bottom-nav { display: flex; }
            .main-content { padding: 0; height: 100vh; }
            .reels-container { max-width: 100%; height: 100vh; border-radius: 0; padding-top: 65px; padding-bottom: 65px; }
            .reel-item { height: calc(100vh - 130px); border-radius: 0; }
        }
    </style>
</head>

    <script>
        const badWords = ["küfür1", "argo2", "salak", "aptal"]; 
        let videoCount = 0;
        const container = document.getElementById('reelsContainer');
        let videoObserver;
        let currentActiveVideoId = null;
        let localUploadedVideos = [];
        let selfUser = { username: "@user", avatarLetter: "U" };

        const videoSources = [
            "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-lighting-39841-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-tunnel-of-futuristic-blue-lights-42283-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-playing-with-a-smartphone-in-a-neon-room-41902-large.mp4"
        ];
        
        const captions = [
            "Yapay zeka kod yazarken kahve bitince yazılımcı krizleri... 💻☕",
            "Sıradan bir günde sunucu odasında yaşanan patlamalar! 🔥",
            "Müşteri 'küçük bir değişiklik' isteyince benim tasarımcı modu 🎨",
            "Oyuncu bilgisayarına RGB led döşeyince performans artışı hissiyatı...",
            "İnternet hızı 1 Mbps'e düşünce odadaki gerilim hattı 🎮❌"
        ];

        const usersDatabase = {};
        const usersList = ["mizah_kod", "caps_hane", "vfx_master", "gamer_ruhu", "esentech_digital", "kod_bukucleri"];

        function generateSocialDatabase() {
            usersList.forEach((username) => {
                usersDatabase[username] = {
                    username: "@" + username,
                    avatarLetter: username[0].toUpperCase(),
                    isFollowing: false
                };
            });
        }
        generateSocialDatabase();

        function switchGatewayTab(type) {
            const tabReg = document.getElementById('tabRegister');
            const tabLog = document.getElementById('tabLogin');
            const formReg = document.getElementById('gFormRegister');
            const formLog = document.getElementById('gFormLogin');

            if(type === 'register') {
                tabReg.classList.add('active'); tabLog.classList.remove('active');
                formReg.classList.add('active'); formLog.classList.remove('active');
            } else {
                tabReg.classList.remove('active'); tabLog.classList.add('active');
                formReg.classList.remove('active'); formLog.classList.add('active');
            }
        }

        function handleGatewayAuth(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('gRegUser').value.trim().replace('@', '');
            if(!usernameInput) return;

            selfUser.username = "@" + usernameInput;
            selfUser.avatarLetter = usernameInput[0].toUpperCase();
            
            document.getElementById('authGateway').style.display = 'none';
            loadMoreVideos(5);
        }

        function sanitizeInput(text) {
            const element = document.createElement('div');
            element.innerText = text;
            let clean = element.innerHTML;
            badWords.forEach(word => {
                const regex = new RegExp(word, "gi");
                clean = clean.replace(regex, "***");
            });
            return clean;
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function createReelCard(index) {
            const src = videoSources[index % videoSources.length];
            const caption = captions[index % captions.length];
            const username = usersList[index % usersList.length];
            const uData = usersDatabase[username];
            const likes = Math.floor(Math.random() * 4000) + 200;
            const commentsCount = Math.floor(Math.random() * 150) + 10;

            return `
                <div class="reel-item" data-id="${index}" data-author="${username}">
                    <i class="fa-solid fa-heart double-tap-heart"></i>
                    <video class="video-player" loop muted playsinline onclick="togglePlay(this)" ondoubleclick="triggerHeart(event, this)">
                        <source src="${src}" type="video/mp4">
                    </video>
                    
                    <div class="interaction-panel">
                        <button class="action-node" onclick="toggleLike(this)">
                            <i class="fa-solid fa-heart"></i><span class="like-count">${likes}</span>
                        </button>
                        <button class="action-node" onclick="openComments('${index}')">
                            <i class="fa-solid fa-comment"></i><span>${commentsCount}</span>
                        </button>
                        <button class="action-node" onclick="openShareSheet('${index}')">
                            <i class="fa-solid fa-share"></i><span>Gönder</span>
                        </button>
                    </div>

                    <div class="reel-details">
                        <div class="author-info">
                            <div class="author-avatar">${uData.avatarLetter}</div>
                            <h4>${uData.username}</h4>
                            <button class="btn-follow ${uData.isFollowing ? 'following' : ''}" onclick="handleSocialFollow('${username}')">
                                ${uData.isFollowing ? 'Takiptesin' : 'Takip Et'}
                            </button>
                        </div>
                        <p class="reel-caption">${caption}</p>
                    </div>
                </div>
            `;
        }

        function loadMoreVideos(count = 5) {
            for (let i = 0; i < count; i++) {
                container.innerHTML += createReelCard(videoCount);
                videoCount++;
            }
            refreshObserver();
        }

        function handleInfiniteScroll() {
            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 500) {
                loadMoreVideos(5);
            }
        }

        function togglePlay(video) {
            if (video.paused) { 
                video.play().catch((err)=>{ console.log("Oynatma hatası:", err); }); 
            } else { 
                video.pause(); 
            }
        }

        function triggerHeart(e, video) {
            const reelItem = video.closest('.reel-item');
            const heart = reelItem.querySelector('.double-tap-heart');
            heart.style.left = e.offsetX + 'px';
            heart.style.top = e.offsetY + 'px';
            heart.style.opacity = '1';
            heart.style.transform = 'translate(-50%, -50%) scale(1.2)';
            
            const likeBtn = reelItem.querySelector('.interaction-panel button');
            if(!likeBtn.classList.contains('liked')) toggleLike(likeBtn);

            setTimeout(() => {
                heart.style.opacity = '0';
                heart.style.transform = 'translate(-50%, -50%) scale(0)';
            }, 600);
        }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.innerText);
            countSpan.innerText = btn.classList.contains('liked') ? count + 1 : count - 1;
        }

        function handleSocialFollow(username) {
            const uData = usersDatabase[username];
            if(!uData) return;

            uData.isFollowing = !uData.isFollowing;

            document.querySelectorAll(`.reel-item[data-author="${username}"]`).forEach(item => {
                const fBtn = item.querySelector('.btn-follow');
                if(fBtn) {
                    fBtn.classList.toggle('following', uData.isFollowing);
                    fBtn.innerText = uData.isFollowing ? 'Takiptesin' : 'Takip Et';
                }
            });
        }

        function openUploadVideo() {
            document.getElementById('uploadCaption').value = "";
            document.getElementById('uploadFileInput').value = "";
            document.getElementById('uploadFileStatus').innerText = "Video Dosyası Seç (MP4)";
            openModal('uploadVideoModal');
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                document.getElementById('uploadFileStatus').innerText = "Seçilen: " + input.files[0].name;
            }
        }

        function handleVideoUpload(e) {
            e.preventDefault();
            const fileInput = document.getElementById('uploadFileInput');
            const captionInput = document.getElementById('uploadCaption').value.trim();

            if (!fileInput.files || !fileInput.files[0]) {
                alert("Lütfen bir MP4 video dosyası seçin!");
                return;
            }

            const file = fileInput.files[0];
            const objectURL = URL.createObjectURL(file);
            const secureCaption = sanitizeInput(captionInput);

            localUploadedVideos.unshift({ src: objectURL, caption: secureCaption });

            const index = "local-" + Date.now();
            const likes = 0;
            const commentsCount = 0;

            const newReelHtml = `
                <div class="reel-item" data-id="${index}" data-author="self">
                    <i class="fa-solid fa-heart double-tap-heart"></i>
                    <video class="video-player" loop muted playsinline onclick="togglePlay(this)" ondoubleclick="triggerHeart(event, this)">
                        <source src="${objectURL}" type="video/mp4">
                    </video>
                    
                    <div class="interaction-panel">
                        <button class="action-node" onclick="toggleLike(this)">
                            <i class="fa-solid fa-heart"></i><span class="like-count">${likes}</span>
                        </button>
                        <button class="action-node" onclick="openComments('${index}')">
                            <i class="fa-solid fa-comment"></i><span>${commentsCount}</span>
                        </button>
                        <button class="action-node" onclick="openShareSheet('${index}')">
                            <i class="fa-solid fa-share"></i><span>Gönder</span>
                        </button>
                    </div>

                    <div class="reel-details">
                        <div class="author-info">
                            <div class="author-avatar">${selfUser.avatarLetter}</div>
                            <h4>${selfUser.username}</h4>
                        </div>
                        <p class="reel-caption">${secureCaption}</p>
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('afterbegin', newReelHtml);
            closeModal('uploadVideoModal');
            container.scrollTop = 0;
            refreshObserver();
            
            alert("Yeni Reels videonuz akışta başarıyla yayınlandı!");
        }

        function openComments(id) {
            currentActiveVideoId = id;
            const box = document.getElementById('commentBox');
            box.innerHTML = `
                <div class="comment-item" style="margin-bottom: 8px; font-size: 13px;"><b>@hakan_pro:</b> İlk sahne çok iyi ya, sabah sabah iyi geldi 😂</div>
                <div class="comment-item" style="margin-bottom: 8px; font-size: 13px;"><b>@yazilim_bükücü:</b> Tam olarak bizim ofis ortamı olmuş hahah.</div>
            `;
            openModal('commentModal');
        }

        function secureAddComment(e) {
            e.preventDefault();
            const input = document.getElementById('commentInput');
            const box = document.getElementById('commentBox');
            const secureText = sanitizeInput(input.value.trim());
            
            if(!secureText) return;
            box.innerHTML += `<div class="comment-item" style="margin-bottom: 8px; font-size: 13px;"><b>@sen:</b> ${secureText}</div>`;
            input.value = "";
            box.scrollTop = box.scrollHeight;
        }

        function openShareSheet(id) {
            const currentUrl = window.location.origin + "?reel=" + id;
            const shareText = "İçerikhane platformundaki bu eğlenceli videoyu mutlaka izle! 🎬 -> ";
            
            document.getElementById('shareWP').href = `https://wa.me/?text=${encodeURIComponent(shareText + currentUrl)}`;
            document.getElementById('shareTG').href = `https://telegram.me/share/url?url=${encodeURIComponent(currentUrl)}&text=${encodeURIComponent(shareText)}`;
            document.getElementById('shareFB').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(currentUrl)}`;
            document.getElementById('shareTW').href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(currentUrl)}&text=${encodeURIComponent(shareText)}`;
            document.getElementById('shareRE').href = `https://www.reddit.com/submit?url=${encodeURIComponent(currentUrl)}&title=${encodeURIComponent(shareText)}`;
            
            openModal('shareModal');
        }

        document.querySelectorAll('.app-modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal(this.id);
                }
            });
        });

        function openGlobalShare() { openShareSheet(currentActiveVideoId || 0); }
        
        function copyLink() {
            navigator.clipboard.writeText(window.location.origin + "?reel=" + (currentActiveVideoId || 0));
            alert("Bağlantı linki başarıyla kopyalandı!");
            closeModal('shareModal');
        }

        function refreshObserver() {
            if(videoObserver) videoObserver.disconnect();
            
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (video) {
                        if (entry.isIntersecting) {
                            video.play().catch((err) => { console.log("Otomatik oynatma engellendi, tıklama bekleniyor."); });
                            currentActiveVideoId = entry.target.getAttribute('data-id');
                        } else {
                            video.pause();
                            video.currentTime = 0;
                        }
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.reel-item').forEach(item => videoObserver.observe(item));
        }
    </script>
</body>
</html>
