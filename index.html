<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGDOM 4169 - Krallık Merkezi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    color-scheme: dark;
    --kh-bg: #070b14;
    --kh-card: #111827;
    --kh-gold: #f59e0b;
    --kh-red: #dc2626;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    background: var(--kh-bg);
    color: #f3f4f6;
    min-height: 100vh;
}
input, select, textarea { font-size: 16px !important; }
.kh-panel {
    background: linear-gradient(145deg, #111827, #090e19);
    border: 1px solid rgba(245,158,11,.4);
    border-radius: 1.25rem;
    box-shadow: 0 18px 45px rgba(0,0,0,.24);
}
.kh-card {
    display: block;
    min-width: 0;
    padding: 1rem;
    border: 1px solid rgba(148,163,184,.18);
    border-radius: 1rem;
    background: rgba(3,7,18,.55);
}
.kh-kicker {
    color: #fbbf24;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .18em;
}
.kh-count {
    color: #fbbf24;
    font-size: clamp(1.25rem, 5vw, 2rem);
    line-height: 1.3;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}
.kh-muted {
    color: #6b7280;
    font-size: 10px;
    line-height: 1.5;
}
.kh-progress {
    height: 7px;
    overflow: hidden;
    border-radius: 999px;
    background: #1f2937;
}
.kh-progress span {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #d97706, #fbbf24);
    transition: width .25s ease;
}
.kh-choice {
    display: block;
    width: 100%;
    padding: .75rem;
    border: 1px solid #374151;
    border-radius: .75rem;
    background: rgba(17,24,39,.8);
    color: #e5e7eb;
    text-align: left;
    font-size: 12px;
    transition: border-color .2s, background .2s;
}
.kh-choice:hover, .kh-choice.selected {
    border-color: #f59e0b;
    background: rgba(245,158,11,.1);
}
@media(max-width: 480px) {
    .kh-card { padding: .85rem; }
    .kh-community-grid { grid-template-columns: 1fr; }
    .kh-feature-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="bg-rokdark text-gray-100 min-h-screen flex flex-col font-sans">

<header class="bg-gray-900/95 border-b border-amber-500/40 sticky top-0 z-50 shadow-2xl">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-amber-600 to-red-600 p-2 rounded-xl w-10 h-10 flex items-center justify-center">
                <i class="fa-solid fa-crown text-xl text-yellow-100"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-500">KINGDOM 4169</h1>
                <span class="text-[9px] sm:text-xs text-amber-400/80 font-semibold tracking-wider">RESMİ KRALLIK MERKEZİ</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="flex bg-gray-950 rounded-xl p-1 border border-gray-700 gap-1">
                <button onclick="changeLanguage('tr')" id="lang-tr" class="px-2 py-1 text-[10px] font-bold rounded-lg bg-amber-600 text-white">TR</button>
                <button onclick="changeLanguage('en')" id="lang-en" class="px-2 py-1 text-[10px] font-bold rounded-lg text-gray-400">EN</button>
            </div>
            <button onclick="openAdminModal()" class="bg-amber-600 text-white text-[11px] px-3 py-2 rounded-xl font-bold">
                <i class="fa-solid fa-lock mr-1"></i>Admin
            </button>
        </div>
    </div>
</header>

<main class="flex-grow max-w-5xl w-full mx-auto px-3 sm:px-4 py-5 space-y-5">

<section class="kh-panel p-5 sm:p-8">
    <span class="kh-kicker">RISE OF KINGDOMS • SERVER 4169</span>
    <h2 class="text-2xl sm:text-4xl font-black mt-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-500 to-red-500">4169 KRALLIK KOMUTASI</h2>
    <p class="text-gray-300 text-xs sm:text-sm mt-3">Krallık duyuruları, etkinlikler, oyuncu sıralaması ve topluluk bağlantıları tek merkezde.</p>
    <div class="mt-4 text-amber-400 font-mono text-xs"><i class="fa-regular fa-clock mr-1"></i><span id="utcClockMob">UTC: --:--:--</span></div>
</section>

<section class="kh-panel p-4 sm:p-6 space-y-4">
    <div class="flex flex-wrap justify-between items-center gap-2">
        <div>
            <p class="kh-kicker">OFFICIAL KINGDOM MAIL</p>
            <h2 class="text-lg sm:text-xl font-black text-amber-300">Krallık ve İttifak Mail Kutusu</h2>
        </div>
        <span id="postCount" class="text-xs text-amber-300 bg-gray-950 px-3 py-2 rounded-full">0 Mail</span>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <button onclick="switchTab('general')" id="tab-btn-general" class="bg-amber-600 text-white rounded-xl p-3 text-xs font-bold">GENEL</button>
        <button onclick="switchTab('top1')" id="tab-btn-top1" class="bg-gray-950 border border-gray-700 rounded-xl p-3 text-xs">TOP 1</button>
        <button onclick="switchTab('top2')" id="tab-btn-top2" class="bg-gray-950 border border-gray-700 rounded-xl p-3 text-xs">TOP 2</button>
        <button onclick="switchTab('top3')" id="tab-btn-top3" class="bg-gray-950 border border-gray-700 rounded-xl p-3 text-xs">TOP 3</button>
    </div>
    <div id="postsContainer" class="space-y-3"></div>
</section>

<!-- Topluluk bağlantıları ve özellikleri bir sonraki bölümde devam eder. -->
